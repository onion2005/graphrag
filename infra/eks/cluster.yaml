apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: graphrag-gpu
  region: us-east-1
  version: "1.31"

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest

managedNodeGroups:
  - name: system
    instanceType: m5.large
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    labels:
      role: system
    tags:
      karpenter.sh/discovery: graphrag-gpu
